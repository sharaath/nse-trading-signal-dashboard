version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: msb-db
    environment:
      POSTGRES_DB: marketsignalbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketsignalbot"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: msb-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/marketsignalbot
      - SYSTEM_MODE=${SYSTEM_MODE}
      - REAL_ORDERS_ENABLED=${REAL_ORDERS_ENABLED}
      - MARKET_DATA_PROVIDER=${MARKET_DATA_PROVIDER}
      - FYERS_CLIENT_ID=${FYERS_CLIENT_ID}
      - FYERS_SECRET_KEY=${FYERS_SECRET_KEY}
      - FYERS_ACCESS_TOKEN=${FYERS_ACCESS_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ENABLE_API_SCANNER=false
      - ENABLE_TELEGRAM_IN_API=false
    depends_on:
      db:
        condition: service_healthy
    restart: always

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: msb-worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/marketsignalbot
      - SYSTEM_MODE=${SYSTEM_MODE}
      - REAL_ORDERS_ENABLED=${REAL_ORDERS_ENABLED}
      - MARKET_DATA_PROVIDER=${MARKET_DATA_PROVIDER}
      - FYERS_CLIENT_ID=${FYERS_CLIENT_ID}
      - FYERS_SECRET_KEY=${FYERS_SECRET_KEY}
      - FYERS_ACCESS_TOKEN=${FYERS_ACCESS_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - PERSONAL_USE_ONLY=true
      - FORCE_SCAN=${FORCE_SCAN}
    depends_on:
      db:
        condition: service_healthy
    restart: always

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: msb-bot
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/marketsignalbot
      - SYSTEM_MODE=${SYSTEM_MODE}
      - REAL_ORDERS_ENABLED=${REAL_ORDERS_ENABLED}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: msb-frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: always

volumes:
  pgdata:
